<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <link rel="stylesheet" href="style.css">
  <title>Ohm</title>
</head>
<body>
  <div id="stage">
    <div class="island" id="island" data-state="collapsed" data-available="false" data-playing="false">

      <!-- Compact layer -->
      <div class="layer compact" id="compact">
        <div class="artSlot cArt" id="cArt">
          <svg class="idleGlyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18.5V6.2c0-.5.3-.9.8-1l8-2c.7-.2 1.2.3 1.2 1v11.3a3 3 0 1 1-2-2.8V7.3l-6 1.5v11.7a3 3 0 1 1-2-2.8z"/>
          </svg>
        </div>
        <div class="cTitle" id="cTitle"><span class="cTitleInner" id="cTitleInner">Not playing</span></div>
        <div class="eq eqSmall" id="cEq" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <!-- Expanded layer -->
      <div class="layer expandedLayer" id="expandedLayer">
        <div class="xPlaying">
          <div class="row xTop">
            <div class="artSlot xArt" id="xArt">
              <svg class="idleGlyph" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18.5V6.2c0-.5.3-.9.8-1l8-2c.7-.2 1.2.3 1.2 1v11.3a3 3 0 1 1-2-2.8V7.3l-6 1.5v11.7a3 3 0 1 1-2-2.8z"/>
              </svg>
            </div>
            <div class="xMeta">
              <div class="xTitleClip"><div class="xTitle" id="xTitle">Not playing</div></div>
              <div class="xArtist" id="xArtist">Open Spotify to get started</div>
            </div>
            <div class="eq eqLarge" id="xEq" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </div>
          </div>

          <div class="row xProg" id="xProg">
            <span class="time" id="tElapsed">0:00</span>
            <div class="progress" id="progress">
              <div class="track"><div class="fill" id="fill"></div></div>
            </div>
            <span class="time tRight" id="tRemain">-0:00</span>
          </div>

          <div class="row xCtl">
            <button class="btn btnSmall" id="bShuffle">
              <svg viewBox="0 0 24 24" class="stroked"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
              <span class="smartBadge">✦</span>
            </button>
            <button class="btn btnMed" id="bPrev">
              <svg viewBox="0 0 24 24"><path d="M19 5.6v12.8c0 .8-.9 1.3-1.6.9L8 12.9c-.6-.4-.6-1.3 0-1.7l9.4-6.4c.7-.5 1.6 0 1.6.8z"/><rect x="4.4" y="4.5" width="2.6" height="15" rx="1.3"/></svg>
            </button>
            <button class="btn btnPlay" id="bPlay">
              <svg viewBox="0 0 24 24" class="icoPlay"><path d="M7.5 4.9v14.2c0 .9 1 1.5 1.8 1l11-7.1c.7-.5.7-1.5 0-2l-11-7.1c-.8-.5-1.8.1-1.8 1z"/></svg>
              <svg viewBox="0 0 24 24" class="icoPause"><rect x="6" y="4.2" width="4.4" height="15.6" rx="1.7"/><rect x="13.6" y="4.2" width="4.4" height="15.6" rx="1.7"/></svg>
            </button>
            <button class="btn btnMed" id="bNext">
              <svg viewBox="0 0 24 24"><path d="M5 5.6v12.8c0 .8.9 1.3 1.6.9l9.4-6.4c.6-.4.6-1.3 0-1.7L6.6 4.7C5.9 4.3 5 4.8 5 5.6z"/><rect x="17" y="4.5" width="2.6" height="15" rx="1.3"/></svg>
            </button>
            <button class="btn btnSmall" id="bRepeat">
              <svg viewBox="0 0 24 24" class="stroked"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              <span class="oneBadge" id="oneBadge">1</span>
            </button>
          </div>
        </div>

        <div class="xIdle" id="xIdle">
          <div class="xIdleText">Nothing playing right now</div>
          <button class="openBtn" id="bOpen">Open Spotify</button>
        </div>
      </div>

    </div>

    <!-- Spotify app volume, docked beside the expanded island -->
    <div class="volPill" id="volPill">
      <div class="volTrack"><div class="volFill" id="volFill"></div></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
